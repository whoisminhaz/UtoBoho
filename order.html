<style>
:root{
  --cream:#faf7f2;--warm:#f5efe4;--terra:#b5602a;--terra2:#d4845a;
  --brown:#4a2e1a;--dark:#2c1a0e;--muted:#8a7060;--border:#ddd0bb;
  --green:#15803d;--hdr:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--dark);}

/* HEADER */
.hdr{background:var(--brown);color:#faf7f2;padding:11px 18px 9px;text-align:center;
  position:sticky;top:0;z-index:300;box-shadow:0 2px 20px rgba(44,26,14,.35);height:var(--hdr);}
.hdr-logo{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;letter-spacing:.05em;opacity:.92;}
.tpill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:3px 12px;
  font-size:12px;color:#f9c784;font-weight:500;margin-top:4px;cursor:pointer;transition:.2s;}
.tpill:hover{background:rgba(255,255,255,.22);}

/* CUSTOMER BAR */
.cbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;}
.cbar label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:5px;}
.cbar input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;
  font-family:'DM Sans',sans-serif;font-size:14px;color:var(--dark);background:var(--cream);outline:none;transition:.2s;}
.cbar input:focus{border-color:var(--terra);}
.cbar input::placeholder{color:var(--muted);opacity:.65;}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);overflow-x:auto;
  scrollbar-width:none;position:sticky;top:var(--hdr);z-index:200;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:11px 13px;border:none;background:transparent;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;}
.tab.on{color:var(--terra);border-bottom-color:var(--terra);}
.tcnt{background:var(--terra);color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;margin-left:3px;display:none;}
.tab.has .tcnt{display:inline;}

/* SUBCAT HEADER */
.sch{padding:18px 16px 8px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;
  color:var(--brown);display:flex;align-items:center;gap:10px;}
.sch::after{content:'';flex:1;height:1px;background:var(--border);}

/* ITEM CARD */
.icard{display:flex;align-items:center;gap:12px;background:#fff;
  border-top:1px solid var(--border);padding:12px 16px;transition:.15s;}
.icard.on{background:#fffaf5;}
.ithumb{width:68px;height:68px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--warm);}
.iemoji{width:68px;height:68px;border-radius:9px;flex-shrink:0;
  background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:26px;}
.ibody{flex:1;min-width:0;}
.badges{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:3px;}
.badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:500;}
.bs{background:#fee2e2;color:#b91c1c;}.vg{background:#dcfce7;color:var(--green);}
.nw{background:#fef3c7;color:#b45309;}.sh{background:#ede9fe;color:#7c3aed;}.ot{background:#f3f4f6;color:#4b5563;}
.iname{font-family:'Cormorant Garamond',serif;font-size:15.5px;font-weight:600;color:var(--dark);line-height:1.2;}
.idesc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45;}
.ifoot{display:flex;align-items:center;justify-content:space-between;margin-top:5px;}
.iprice{font-size:13px;font-weight:500;color:var(--terra);}
.ical{font-size:10px;color:var(--muted);margin-left:4px;}
.qc{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qbtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:#fff;
  color:var(--brown);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.qbtn.p{background:var(--terra);border-color:var(--terra);color:#fff;}
.qbtn.p:hover{background:var(--brown);border-color:var(--brown);}
.qbtn.m:hover{border-color:var(--terra);color:var(--terra);}
.qnum{min-width:17px;text-align:center;font-size:14px;font-weight:500;}

/* NOTES */
.nbox{padding:14px 16px 6px;}
.nbox label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:5px;}
.nbox textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;
  font-family:'DM Sans',sans-serif;font-size:13px;color:var(--dark);background:#fff;
  outline:none;resize:vertical;min-height:65px;transition:.2s;}
.nbox textarea:focus{border-color:var(--terra);}

/* ORDER FOOTER */
.obar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
  padding:10px 16px 18px;box-shadow:0 -4px 24px rgba(44,26,14,.1);z-index:200;}
.orow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.olabel{font-size:12px;color:var(--muted);}
.oamt{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;}
.orm{font-size:12px;font-weight:400;color:var(--muted);margin-right:2px;}
.sbtn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--terra);color:#fff;
  font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;cursor:pointer;transition:.2s;}
.sbtn:hover:not(:disabled){background:var(--brown);}
.sbtn:disabled{background:var(--muted);opacity:.6;cursor:default;}

/* MODALS */
.ov{position:fixed;inset:0;background:rgba(44,26,14,.72);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.ov.hide{display:none;}
.mc{background:#fff;border-radius:20px;padding:26px 20px;max-width:380px;width:100%;
  max-height:88vh;overflow-y:auto;}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;
  color:var(--dark);margin-bottom:4px;text-align:center;}
.msub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px;}
/* Table grid */
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px;}
.tbtn{padding:9px 4px;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);
  font-size:13px;font-weight:500;color:var(--brown);cursor:pointer;transition:.15s;}
.tbtn:hover{border-color:var(--terra);color:var(--terra);background:#fff8f3;}
.twbtn{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--warm);font-size:14px;color:var(--brown);cursor:pointer;transition:.15s;}
.twbtn:hover{border-color:var(--terra);}
/* Receipt */
.rinfo{background:var(--warm);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.rrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.rrow:last-child{margin:0;}.rlbl{color:var(--muted);}.rval{font-weight:500;}
.roid{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--terra);}
.ritem{display:flex;justify-content:space-between;align-items:flex-start;
  padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;}
.ritem:last-child{border:none;}
.riname{flex:1;color:var(--dark);}.riqty{color:var(--muted);margin-right:6px;}
.riprice{font-weight:500;color:var(--terra);white-space:nowrap;}
.rtotal{display:flex;justify-content:space-between;padding-top:10px;border-top:2px solid var(--border);}
.rtlbl,.rtamt{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;}
.rtamt{color:var(--terra);}
.rnbtn{width:100%;margin-top:14px;padding:11px;border:2px solid var(--terra);border-radius:10px;
  background:transparent;color:var(--terra);font-family:'Cormorant Garamond',serif;font-size:16px;cursor:pointer;transition:.2s;}
.rnbtn:hover{background:var(--terra);color:#fff;}
/* Spinner */
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:5px;}
@keyframes sp{to{transform:rotate(360deg)}}
main{padding-bottom:115px;}
</style>
</head>

// ════════════════════════
// STATE
// ════════════════════════
var cart={}, tableNum="", activeTab=MENU[0].id;

// ════════════════════════
// BOOT
// ════════════════════════
(function(){
  var p=new URLSearchParams(window.location.search),t=p.get("table");
  if(t){tableNum=t;setTpill(t);}else{openTM();}
  buildTabs();renderTab(activeTab);
})();

// ════════════════════════
// TABLE MODAL
// ════════════════════════
function openTM(){
  document.getElementById("tm").classList.remove("hide");
  var g=document.getElementById("tgrid");g.innerHTML="";
  for(var i=1;i<=TOTAL_TABLES;i++){(function(n){
    var b=document.createElement("button");
    b.className="tbtn";b.textContent=n;b.onclick=function(){pickT(n);};g.appendChild(b);
  })(i);}
}
function pickT(n){tableNum=String(n);setTpill(tableNum);document.getElementById("tm").classList.add("hide");}
function setTpill(n){document.getElementById("tdsp").textContent=(n==="Takeaway")?n:"Table "+n;}

// ════════════════════════
// TABS
// ════════════════════════
function buildTabs(){
  var nav=document.getElementById("tabs");nav.innerHTML="";
  MENU.forEach(function(c){
    var b=document.createElement("button");
    b.className="tab"+(c.id===activeTab?" on":"");b.dataset.cid=c.id;
    b.innerHTML=c.icon+" "+c.label+' <span class="tcnt" id="tc-'+c.id+'">0</span>';
    b.onclick=function(){switchTab(c.id);};nav.appendChild(b);
  });
}
function switchTab(cid){
  activeTab=cid;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.cid===cid);});
  renderTab(cid);
  window.scrollTo({top:document.getElementById("tabs").offsetTop-64,behavior:"smooth"});
}

// ════════════════════════
// RENDER
// ════════════════════════
function badgeCls(b){
  if(b==="Best Seller")return"badge bs";if(b==="Vegan")return"badge vg";
  if(b==="New")return"badge nw";if(b==="Sharing")return"badge sh";return"badge ot";
}
function renderTab(cid){
  var cat=MENU.find(function(c){return c.id===cid;});if(!cat)return;
  var h="";
  cat.subcats.forEach(function(sub){
    h+='<div class="sch">'+sub.name+'</div>';
    sub.items.forEach(function(it){
      var qty=cart[it.id]||0;
      var bdg=(it.b||[]).map(function(b){return'<span class="'+badgeCls(b)+'">'+b+'</span>';}).join("");
      h+='<div class="icard'+(qty>0?" on":"")+'" id="cd-'+it.id+'">'
        +'<div class="iemoji" id="et-'+it.id+'">'+(it.e||"🍽️")+'</div>'
        +'<div class="ibody">'
          +(bdg?'<div class="badges">'+bdg+'</div>':"")
          +'<div class="iname">'+it.name+'</div>'
          +'<div class="idesc">'+it.desc+'</div>'
          +'<div class="ifoot">'
            +'<span><span class="iprice">RM '+it.price+'</span>'+(it.cal?'<span class="ical">~'+it.cal+' kcal</span>':"")+'</span>'
            +'<div class="qc">'
              +'<button class="qbtn m" onclick="chQ(\''+it.id+'\',-1)">−</button>'
              +'<span class="qnum" id="qn-'+it.id+'">'+qty+'</span>'
              +'<button class="qbtn p" onclick="chQ(\''+it.id+'\',1)">+</button>'
            +'</div>'
          +'</div>'
        +'</div>'
        +'</div>';
    });
  });
  h+='<div class="nbox"><label>Special Requests / Notes</label>'
    +'<textarea id="snotes" placeholder="Egg style (scrambled/poached etc), hot or cold drinks, allergies, less sugar, spice level…"></textarea></div>';
  document.getElementById("menuMain").innerHTML=h;
  syncUI();loadImgs(cat);
}
function loadImgs(cat){
  cat.subcats.forEach(function(s){s.items.forEach(function(it){
    if(!it.img)return;
    var el=document.getElementById("et-"+it.id);if(!el)return;
    var img=new Image();
    img.onload=function(){
      var fresh=document.getElementById("et-"+it.id);
      if(!fresh||!fresh.parentNode)return;
      var i=document.createElement("img");i.src=it.img;i.className="ithumb";i.alt=it.name;
      fresh.parentNode.replaceChild(i,fresh);
    };img.src=it.img;
  });});
}

// ════════════════════════
// CART
// ════════════════════════
function findIt(id){
  for(var ci=0;ci<MENU.length;ci++)for(var si=0;si<MENU[ci].subcats.length;si++)
    for(var ii=0;ii<MENU[ci].subcats[si].items.length;ii++)
      if(MENU[ci].subcats[si].items[ii].id===id)return MENU[ci].subcats[si].items[ii];
  return null;
}
function chQ(id,d){
  cart[id]=Math.max(0,(cart[id]||0)+d);
  if(!cart[id])delete cart[id];
  var qn=document.getElementById("qn-"+id),cd=document.getElementById("cd-"+id);
  if(qn)qn.textContent=cart[id]||0;
  if(cd)cd.classList.toggle("on",(cart[id]||0)>0);
  updateFtr();
}
function syncUI(){
  Object.keys(cart).forEach(function(id){
    var qn=document.getElementById("qn-"+id),cd=document.getElementById("cd-"+id);
    if(qn)qn.textContent=cart[id];if(cd)cd.classList.toggle("on",cart[id]>0);
  });
}
function updateFtr(){
  var total=0,cnt=0,tc={};
  MENU.forEach(function(c){tc[c.id]=0;});
  Object.keys(cart).forEach(function(id){
    var it=findIt(id),q=cart[id];if(!it||!q)return;
    total+=it.price*q;cnt+=q;
    MENU.forEach(function(c){
      c.subcats.forEach(function(s){s.items.forEach(function(i){
        if(i.id===id)tc[c.id]=(tc[c.id]||0)+q;
      });});
    });
  });
  document.getElementById("totDisp").textContent=total.toFixed(2);
  document.getElementById("cntLbl").textContent=cnt+" item"+(cnt!==1?"s":"");
  var btn=document.getElementById("sbtn");
  if(cnt>0){btn.disabled=false;btn.textContent="Place Order ("+cnt+" item"+(cnt!==1?"s":"")+")\u00a0\u2192";}
  else{btn.disabled=true;btn.textContent="Add items to order";}
  MENU.forEach(function(c){
    var tce=document.getElementById("tc-"+c.id),te=document.querySelector('[data-cid="'+c.id+'"]');
    if(tce)tce.textContent=tc[c.id]||0;if(te)te.classList.toggle("has",(tc[c.id]||0)>0);
  });
}

// ════════════════════════
// SUBMIT
// ════════════════════════
function submit(){
  var name=(document.getElementById("cname").value||"").trim();
  var sn=document.getElementById("snotes"),notes=sn?(sn.value||"").trim():"";
  if(!name){
    document.getElementById("cname").focus();
    document.getElementById("cname").style.borderColor="var(--terra)";
    document.getElementById("cname").placeholder="Please enter your name first ✦";
    window.scrollTo({top:0,behavior:"smooth"});return;
  }
  if(!tableNum){openTM();return;}
  var btn=document.getElementById("sbtn");
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Sending…';
  var items=[],total=0;
  Object.keys(cart).forEach(function(id){
    var it=findIt(id),q=cart[id];if(!it||!q)return;
    items.push({name:it.name,qty:q,price:it.price,sub:it.price*q});total+=it.price*q;
  });
  var oid=genOid();
  var txt=items.map(function(i){return"  • "+i.qty+"× "+i.name+" (RM "+i.sub.toFixed(2)+")";}).join("\n");
  if(notes)txt+="\n\n  📝 Notes: "+notes;
  fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action: "newOrder", orderId:oid, table:tableNum, customer:name, items:txt, total:parseFloat(total)})
  }).then(function(){showReceipt(oid,name,items,total,notes);})
  .catch(function(){btn.disabled=false;btn.textContent="Retry — please try again";});
}
function genOid(){
  var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="UB-";
  for(var i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

// ════════════════════════
// RECEIPT
// ════════════════════════
function showReceipt(oid,name,items,total,notes){
  var now=new Date();
  var t=now.toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kuala_Lumpur"});
  var d=now.toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Kuala_Lumpur"});
  var tbl=(tableNum==="Takeaway"||isNaN(tableNum))?tableNum:"Table "+tableNum;
  var ih=items.map(function(i){
    return'<div class="ritem"><span class="riname">'+i.name+'</span>'
      +'<span class="riqty">'+i.qty+'×</span><span class="riprice">RM '+i.sub.toFixed(2)+'</span></div>';
  }).join("");
  document.getElementById("rc").innerHTML=
    '<div style="font-size:44px;text-align:center;margin-bottom:10px;">✅</div>'
    +'<div class="mtitle" style="margin-bottom:3px;">Order Placed!</div>'
    +'<p class="msub" style="margin-bottom:14px;">Your order is heading to our kitchen.<br>Sit back & enjoy the vibe ☕</p>'
    +'<div class="rinfo">'
      +'<div class="rrow"><span class="rlbl">Order ID</span>'
        +'<span class="roid">'+oid+'</span></div>'
      +'<div class="rrow"><span class="rlbl">Table</span><span class="rval">'+tbl+'</span></div>'
      +'<div class="rrow"><span class="rlbl">Name</span><span class="rval">'+name+'</span></div>'
      +'<div class="rrow"><span class="rlbl">Time</span><span class="rval">'+t+' · '+d+'</span></div>'
    +'</div>'
    +'<div style="margin-bottom:10px;">'+ih+'</div>'
    +(notes?'<div style="background:var(--warm);border-radius:7px;padding:8px 11px;font-size:11px;color:var(--muted);margin-bottom:10px;">📝 '+notes+'</div>':"")
    +'<div class="rtotal"><span class="rtlbl">Total</span><span class="rtamt">RM '+total.toFixed(2)+'</span></div>'
    +'<button class="rnbtn" onclick="resetOrd()">✦ Place Another Order</button>';
  document.getElementById("rm").classList.remove("hide");
}
function resetOrd(){
  cart={};document.getElementById("rm").classList.add("hide");
  document.getElementById("cname").value="";
  renderTab(activeTab);updateFtr();window.scrollTo({top:0,behavior:"smooth"});
}
